<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fbfbf7;
      --bg-alt: #eef3ea;
      --text: #1a231d;
      --muted: #4b5850;
      --forest: #1b4332;
      --forest-dark: #123024;
      --earth: #6b4226;
      --gold: #b8860b;
      --border: #c9d6c3;
      --cancelled: #8b2e2e;
      --focus-ring: #1b4332;
      /* Brand hero band - deliberately fixed across light/dark, not themed */
      --hero-bg: #1b4332;
      --hero-bg-alt: #123024;
      --hero-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11150f;
        --bg-alt: #1b2318;
        --text: #e3eae0;
        --muted: #a9b8ac;
        --forest: #8fd9b6;
        --forest-dark: #b7ecd2;
        --earth: #d9b866;
        --gold: #e0b23c;
        --border: #33402d;
        --cancelled: #e59a9a;
        --focus-ring: #8fd9b6;
        --hero-bg: #123024;
        --hero-bg-alt: #0b1f18;
      }
    }

    * { box-sizing: border-box; }
    html { font-size: 100%; }
    body {
      font-family: "Nunito", Arial, sans-serif;
      font-size: 1.0625rem;
      line-height: 1.65;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }
    .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }

    h1, h2, h3, h4, h5, h6 {
      font-family: "Playfair Display", Georgia, serif;
      color: var(--forest);
      line-height: 1.25;
    }

    a { color: var(--forest); }
    a:hover { color: var(--forest-dark); }
    :focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      background: var(--bg);
      color: var(--forest);
      padding: 10px 16px;
      z-index: 100;
      border: 2px solid var(--forest);
    }
    .skip-link:focus {
      left: 12px;
      top: 12px;
    }

    .hero-band {
      background: linear-gradient(135deg, var(--hero-bg), var(--hero-bg-alt));
      padding: 26px 0 0;
    }
    .hero-band .site-title {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--hero-text);
      text-decoration: none;
      display: block;
      text-align: center;
      padding-bottom: 18px;
    }
    .hero-band .site-title:hover { color: var(--hero-text); opacity: 0.85; }

    nav.site-nav {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 10px 0;
    }
    nav.site-nav a {
      color: var(--hero-text);
      text-decoration: none;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 999px;
    }
    nav.site-nav a:hover,
    nav.site-nav a:focus-visible {
      background: rgba(255, 255, 255, 0.16);
    }
    nav.site-nav a:focus-visible { outline-color: var(--hero-text); }

    main { padding: 32px 0 60px; }
    main :first-child { margin-top: 0; }
    /* A right/left-floated image (beedance-ssg-editor's image-alignment
       feature) taller than the text next to it otherwise visually escapes
       past main's bottom edge, since nothing clears the float before the
       footer renders. */
    main::after { content: ""; display: table; clear: both; }

    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 26px;
      box-shadow: 0 2px 10px rgba(27, 67, 50, 0.08);
    }
    .cta-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .button {
      display: inline-block;
      background: var(--forest);
      color: var(--hero-text);
      font-weight: 700;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
    }
    .button:hover, .button:focus-visible { background: var(--forest-dark); color: var(--hero-text); }

    .post-list { list-style: none; padding: 0; }
    .post-list li {
      margin-bottom: 14px;
      padding: 10px 14px;
      background: var(--bg-alt);
      border-radius: 8px;
      border: 1px solid var(--border);
      border-left: 4px solid var(--forest);
    }
    .post-list a { font-weight: 700; }
    .post-date { color: var(--muted); font-size: 0.85rem; margin-right: 8px; }
    .post-tags {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .cancelled { color: var(--cancelled); font-weight: 700; }

    blockquote {
      margin: 1.5em 0;
      padding: 0.6em 1.2em;
      border-left: 4px solid var(--earth);
      background: var(--bg-alt);
      font-style: italic;
    }

    img { max-width: 100%; height: auto; border-radius: 6px; }

    footer.site-footer {
      margin-top: 48px;
      padding: 18px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div class="hero-band">
    <div class="container">
      <a class="site-title" href="{{ get_url(path="@/_index.md") }}">{{ config.title }}</a>
      <nav class="site-nav" aria-label="Main">
        <a href="{{ get_url(path="@/_index.md") }}">Home</a>
        <a href="{{ get_url(path="@/about/_index.md") }}">About</a>
        <a href="{{ get_url(path="@/biodiversity/_index.md") }}">Biodiversity</a>
        <a href="{{ get_url(path="@/plant-safari/_index.md") }}">Plant Safari</a>
        <a href="{{ get_url(path="@/events/_index.md") }}">Events</a>
        <a href="{{ get_url(path="@/blog/_index.md") }}">Blog</a>
        <a href="{{ get_url(path="@/news/_index.md") }}">News</a>
      </nav>
    </div>
  </div>

  <div class="container">
    <main id="main-content">
      {% block content %}{% endblock content %}
    </main>

    <footer class="site-footer">
      Easthampton BEES Committee
    </footer>
  </div>
</body>
</html>
